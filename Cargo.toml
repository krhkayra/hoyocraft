[package]
name = "hoyocraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "A Slint Linux launcher for HoYoverse games"

[dependencies]
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
url = "2"
shlex = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
cxx = "=1.0.205"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-qt", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[build-dependencies]
slint-build = "=1.18.1"
cxx-gen = "=0.7.205"
cc = "1"
pkg-config = "0.3"
proc-macro2 = "1"

[dev-dependencies]
tempfile = "3"
